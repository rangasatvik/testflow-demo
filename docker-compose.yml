services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://testflow:testflow@db:5432/testflow
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testflow
      POSTGRES_PASSWORD: testflow
      POSTGRES_DB: testflow
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
